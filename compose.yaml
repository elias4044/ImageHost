services:
  imagehost:
    build: .
    restart: unless-stopped
    init: true
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      DATA_DIR: /data
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-false}
      NSFW_BACKEND: http
      NSFW_URL: http://nsfw:8080/scan
      NSFW_TOKEN: ${NSFW_TOKEN:?Set NSFW_TOKEN to a random secret of at least 32 characters}
      SAFETY_URL: ${SAFETY_URL:-}
      SAFETY_TOKEN: ${SAFETY_TOKEN:-}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-10240}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-80}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
    volumes:
      - imagehost_data:/data
    expose:
      - "8000"
    networks:
      - frontend
      - scanners
      - moderation
    depends_on:
      nsfw:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 110s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  nsfw:
    build:
      context: .
      dockerfile: moderation/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NSFW_TOKEN: ${NSFW_TOKEN:?Set NSFW_TOKEN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    networks:
      - moderation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  clamav:
    profiles:
      - antivirus
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks:
      - scanners
    mem_limit: 2g
    cpus: 1
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  imagehost_data:
  clamav_signatures:

networks:
  frontend:
  scanners:
  moderation:
    internal: true
